name: Dependency Review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "Minimum CVSS severity to fail (low, moderate, high, critical)"
        type: string
        default: "moderate"
      warn-only:
        description: "Never fail — only annotate (for grace period rollout)"
        type: boolean
        default: false
      allow-licenses:
        description: "SPDX license allowlist (empty = no license check)"
        type: string
        default: ""
      deny-licenses:
        description: "SPDX license denylist (empty = no license check)"
        type: string
        default: ""
      enable-codex-remediation:
        description: >-
          Run the DeepSeek auto-remediation job on PR when a vulnerable dep
          change is detected. Default: false. Per
          plans/migrate-codex-deepseek.md the input keeps its `codex-` name
          for caller-compat through Phase G; the action under the hood is
          now DeepSeek (via Goose + OpenRouter).
        type: boolean
        default: false
      deepseek-model:
        description: "OpenRouter model ID for remediation. Default: DeepSeek V4 Flash (dep bumps are simple)."
        type: string
        default: "deepseek/deepseek-v4-flash"
    secrets:
      OPENROUTER_API_KEY:
        description: "OpenRouter API key for DeepSeek remediation"
        required: false
      GREENTIC_CI_APP_ID:
        description: "GitHub App ID for greentic-ci App token minting (used by the DeepSeek remediation job)"
        required: false
      GREENTIC_CI_APP_PRIVATE_KEY:
        description: "GitHub App private key for greentic-ci App token minting (used by the DeepSeek remediation job)"
        required: false

permissions:
  contents: read

jobs:
  # ── Job 1: Always-running dependency review (the required check) ───
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      vulnerable-changes: ${{ steps.review.outputs.vulnerable-changes }}
      has-vulnerabilities: ${{ steps.check_vulns.outputs.has-vulnerabilities }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run dependency review
        id: review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          warn-only: ${{ inputs.warn-only }}
          allow-licenses: ${{ inputs.allow-licenses }}
          deny-licenses: ${{ inputs.deny-licenses }}
          comment-summary-in-pr: "on-failure"

      - name: Check for vulnerabilities
        id: check_vulns
        shell: bash
        run: |
          set -euo pipefail
          VULN_CHANGES='${{ steps.review.outputs.vulnerable-changes }}'
          if [ -n "$VULN_CHANGES" ] && [ "$VULN_CHANGES" != "[]" ] && [ "$VULN_CHANGES" != "" ]; then
            echo "has-vulnerabilities=true" >> "$GITHUB_OUTPUT"
            echo "Vulnerable dependency changes detected."
          else
            echo "has-vulnerabilities=false" >> "$GITHUB_OUTPUT"
            echo "No vulnerable dependency changes."
          fi

  # ── Job 2: Optional DeepSeek auto-remediation for vulnerable deps ──
  # Gated behind `enable-codex-remediation` (default: false). The job-level
  # gate on `has-vulnerabilities == 'true'` is what prevents the LLM from
  # being invoked when there is no work to do.
  codex-dependency-fix:
    needs: dependency-review
    if: >-
      inputs.enable-codex-remediation
      && needs.dependency-review.outputs.has-vulnerabilities == 'true'
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        # continue-on-error: App secrets are empty in greentic-biz private repos
        # (Free-plan org secrets don't propagate to private repos). Steps below
        # fall back to github.token, which has the per-job permissions block's
        # scopes (contents/pull-requests).
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GREENTIC_CI_APP_ID }}
          private-key: ${{ secrets.GREENTIC_CI_APP_PRIVATE_KEY }}

      - name: Check OpenRouter availability
        id: openrouter_available
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured; skipping DeepSeek remediation."
          fi

      - name: Loop guard – skip if triggered by any remediation commit
        id: loop_guard
        if: steps.openrouter_available.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          COMMIT_MSG=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" \
            --jq '.commit.message' 2>/dev/null || echo "")
          # Transitional regex matches both codex (legacy) and deepseek (new)
          # remediation commits. Narrow to deepseek only after Phase G cleanup.
          if echo "$COMMIT_MSG" | grep -qE "^chore\((security|semver|deps)\): (codex|deepseek) remediation"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit is a remediation commit – skipping to prevent loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Build remediation prompt
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        env:
          VULN_CHANGES: ${{ needs.dependency-review.outputs.vulnerable-changes }}
        run: |
          set -euo pipefail
          cat > codex-prompt.txt <<'PROMPT'
          You are operating in a CI environment as a Dependency Security Reviewer.

          Task:
          1) Analyze the vulnerable dependency changes listed below (JSON from dependency-review-action).
          2) Update version constraints in Cargo.toml / package.json to resolve the vulnerabilities.
          3) If this is a Rust project, run `cargo update` after modifying Cargo.toml.
          4) Prefer relaxing version constraints over pinning exact versions.
          5) If no fix is available for a vulnerability (e.g., no patched version exists), note it in the report but do not make changes for it.
          6) Write DEPENDENCY_FIX_REPORT.md summarizing your actions.

          Important rules:
          - Do NOT change any application logic — only dependency version constraints.
          - Do NOT downgrade dependencies unless required to fix a vulnerability.
          - For Rust: prefer `cargo update -p <package>` over editing Cargo.lock directly.
          - For npm: prefer updating package.json constraints, then `npm install` or `yarn install`.

          Vulnerable dependency changes (JSON):
          PROMPT

          echo "$VULN_CHANGES" >> codex-prompt.txt

      - name: Install Goose
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        uses: clouatre-labs/setup-goose-action@7a86bfba08001947997ed330a60215d871f40f8b  # v1.0.8
        with:
          version: '1.34.0'

      - name: Run DeepSeek remediation via OpenRouter
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOSE_PROVIDER: openrouter
          GOOSE_MODEL: ${{ inputs.deepseek-model }}
          GOOSE_DISABLE_KEYRING: '1'
        run: |
          goose run --no-session --instructions codex-prompt.txt

      - name: Commit and push fixes
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ ! -f DEPENDENCY_FIX_REPORT.md ]; then
            echo "No changes created by DeepSeek"
            exit 0
          fi

          git config user.name "greentic-ci[bot]"
          git config user.email "3383573+greentic-ci[bot]@users.noreply.github.com"

          git add -u
          git commit -m "chore(deps): deepseek remediation for vulnerable dependencies" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH}"

      - name: Post DeepSeek Review
        if: steps.openrouter_available.outputs.enabled == 'true' && steps.loop_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -f DEPENDENCY_FIX_REPORT.md ]; then
            echo "Posting dependency fix report to ${PR_URL}"
            gh pr review "${PR_URL}" --comment --body-file DEPENDENCY_FIX_REPORT.md
          fi

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-dependency-fix-run
          path: |
            codex-prompt.txt
            DEPENDENCY_FIX_REPORT.md
          if-no-files-found: ignore
