name: Nightly Coverage

# Reusable coverage workflow. Installs the canonical toolchain
# (cargo-llvm-cov, cargo-nextest, greentic-dev), runs the coverage command,
# uploads the report as a workflow artifact.
#
# Typical caller (schedule):
#   on:
#     schedule: [{ cron: "41 3 * * *" }]
#     workflow_dispatch:
#   jobs:
#     coverage:
#       uses: greenticai/.github/.github/workflows/nightly-coverage.yml@main
#       secrets: inherit
#
# Repos with a coverage policy file pass `coverage-command: "greentic-dev coverage --policy-file coverage-policy.json"`.
# Repos that bypass greentic-dev can pass the raw cargo-llvm-cov invocation.
#
# Slack alerting for scheduled failures is handled by the per-repo
# `.github/workflows/notify-scheduled-failures.yml` catch-all (option-3
# rollout, 2026-04-23) — no inline notify-failure job here.

on:
  workflow_call:
    inputs:
      rust-version:
        description: "Rust toolchain version"
        type: string
        default: "1.95.0"
      coverage-command:
        description: "Coverage invocation. Defaults to 'greentic-dev coverage'. Override to add --policy-file or switch to raw cargo-llvm-cov."
        type: string
        default: "greentic-dev coverage"
      install-greentic-dev:
        description: "Install greentic-dev (provides the coverage wrapper). Disable if using raw cargo-llvm-cov."
        type: boolean
        default: true
      install-cargo-nextest:
        description: "Install cargo-nextest (used by greentic-dev coverage)"
        type: boolean
        default: true
      setup-script:
        description: "Optional shell commands to run before coverage (e.g., fixtures prep)"
        type: string
        default: ""
      checkout-submodules:
        description: "Checkout git submodules (false, true, or recursive)"
        type: string
        default: "false"
      artifact-name:
        description: "Name of the uploaded coverage artifact"
        type: string
        default: "nightly-coverage-report"
      artifact-path:
        description: "Path glob for the coverage artifact upload"
        type: string
        default: "target/coverage/"
      timeout-minutes:
        description: "Job timeout in minutes"
        type: number
        default: 60
      runner:
        description: "Linux runner label (e.g. blacksmith-4vcpu-ubuntu-2404-arm for Blacksmith ARM)"
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Change-gate: on a `schedule` event, short-circuits downstream jobs when
  # HEAD SHA matches the last successful scheduled run of the same workflow.
  # `workflow_dispatch` and first-ever runs always proceed. Inlined rather
  # than extracted into a composite action so the reusable stays self-
  # contained (avoids cross-repo `@main` resolution problems when the
  # action lives in the same repo as the reusable that references it).
  gate:
    runs-on: ${{ inputs.runner }}
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
    steps:
      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          emit() {
            local should_run="$1"
            local reason="$2"
            echo "should-run=${should_run}" >> "${GITHUB_OUTPUT}"
            {
              echo "## Nightly gate"
              echo ""
              echo "- **Event:** \`${EVENT_NAME}\`"
              echo "- **Workflow:** \`${WORKFLOW}\`"
              echo "- **HEAD:** \`${HEAD_SHA}\`"
              echo "- **Decision:** \`${should_run}\` — ${reason}"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "gate: should-run=${should_run} (${reason})"
          }

          if [ "${EVENT_NAME}" != "schedule" ]; then
            emit true "non-schedule event (${EVENT_NAME:-unknown}) always runs"
            exit 0
          fi

          last_sha=$(gh run list \
            --repo "${REPO}" \
            --workflow "${WORKFLOW}" \
            --status success \
            --event schedule \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""' 2>/dev/null || echo "")

          if [ -z "${last_sha}" ]; then
            emit true "no prior successful scheduled run — establishing baseline"
            exit 0
          fi

          if [ "${last_sha}" = "${HEAD_SHA}" ]; then
            emit false "unchanged since last successful scheduled run (${last_sha})"
            exit 0
          fi

          emit true "changed since last successful scheduled run (${last_sha} → ${HEAD_SHA})"

  coverage:
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Three flags/assertions below, each fixing a distinct failure mode.
      # Copy all of them together if you lift this pattern into another repo.
      #
      # --force: Swatinem/rust-cache restores Cargo's install-tracking
      # metadata (~/.cargo/.crates2.json) but NOT the actual binaries under
      # ~/.cargo/bin/. Without --force, binstall reads the stale metadata,
      # concludes "already installed", skips — and the subsequent
      # `cargo llvm-cov …` step fails with `no such command: llvm-cov`.
      #
      # GITHUB_TOKEN: binstall resolves each crate's prebuilt binary through
      # api.github.com. Unauthenticated, that is rate-limited per runner IP
      # (60 req/h shared across every job on that IP) rather than per repo, so
      # a busy org intermittently gets 403s that have nothing to do with the
      # commit under test. Authenticated it is 5000 req/h. `secrets.GITHUB_TOKEN`
      # is minted automatically for every caller of this reusable — callers do
      # NOT need `secrets: inherit` for it (it is the same token the gate job
      # above reads as `github.token`).
      #
      # --disable-strategies compile: a 403 does NOT fail binstall. It silently
      # degrades to the `compile` strategy, which shells out to
      # `cargo install <tool>` WITHOUT --locked. cargo-nextest carries a
      # deliberate `compile_error!` rejecting exactly that ("Nextest does not
      # support being installed without --locked"), so the job burns ~11 minutes
      # compiling toward a link that can never happen and exits 70 — presenting
      # as a Rust build break in a repo whose code is fine. All three tools here
      # publish prebuilt binaries for the runner targets, so the compile strategy
      # is never legitimately used; disabling it converts a slow, misattributed
      # failure into a fast, correctly-attributed one.
      # Root-caused in greenticai/greentic-cap#39.
      #
      # command -v: binstall can report success while leaving nothing on PATH.
      # Assert here so the failure surfaces at the install step rather than two
      # steps later as a confusing "no such command".
      - name: Install cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall -y --force --disable-strategies compile cargo-llvm-cov
          command -v cargo-llvm-cov

      - name: Install cargo-nextest
        if: ${{ inputs.install-cargo-nextest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall -y --force --disable-strategies compile cargo-nextest
          command -v cargo-nextest

      - name: Install greentic-dev
        if: ${{ inputs.install-greentic-dev }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall -y --force --disable-strategies compile greentic-dev
          command -v greentic-dev

      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}

      - name: Run coverage
        run: ${{ inputs.coverage-command }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
