name: Publish to crates.io

on:
  workflow_call:
    inputs:
      crates:
        description: "Space-separated ordered list of crates to publish (dependency order)"
        required: true
        type: string
      rust-version:
        description: "Rust toolchain version"
        type: string
        default: "1.95.0"
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust-version }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Restore the cache, never save it. This job runs once per release
          # tag, so a saved cache is near worthless — and skipping the save
          # also skips rust-cache's post-job cleanup, which is what emits
          # eight ##[error] lines after an otherwise successful publish.
          #
          # cleanup.ts treats any directory basenamed `tests` as a build
          # profile dir and probes `tests/target` + `tests/trybuild` inside
          # it. `cargo publish` leaves target/package/<crate>-<ver>/tests/
          # behind, which is a plain source dir, so both probes ENOENT. The
          # try/catch around them does not help: cleanTargetDir is async and
          # is called without await, so the rejection escapes the synchronous
          # try block and surfaces as an unhandled rejection.
          #
          # Publishing itself is unaffected — the errors land in post-job
          # cleanup, after the crates are already on crates.io — but they
          # make a green release look red and would mask a real failure.
          save-if: false

      - name: Extract version
        id: version
        uses: greenticai/.github/.github/actions/extract-cargo-version@main

      - name: Guard against dev-lane versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The stable crates-publish lane must never publish a `-dev.*`
          # pre-release. Those versions are owned exclusively by the nightly
          # dev-publish lane (dev-publish.yml) on `develop`, and they fall
          # inside every consumer's `>=M.m.0-dev..., <M.(m+1).0-0` range.
          # A manual workflow_dispatch of this workflow from a research/feature
          # branch carrying a hand-edited `-dev.*` version leaks a foreign
          # source tree into the shared dev namespace and breaks downstream
          # resolution (the 2026-06-19 greentic-types 1.1.0-dev.27836473437
          # incident: research-branch tree, no provider_id, out-sorted the
          # legit develop publish and poisoned greentic-secrets' lock).
          if [[ "${VERSION}" == *-dev.* || "${VERSION}" == *-dev ]]; then
            echo "::error::Refusing to publish dev-lane version '${VERSION}' on the stable crates-publish lane."
            echo "::error::'-dev.*' versions belong to dev-publish.yml on develop. To publish from a research/feature branch, use a non-dev pre-release namespace (e.g. 'M.m.p-research.N') that consumers exclude via '<M.(m+1).0-0'."
            exit 1
          fi
          echo "Version '${VERSION}' is not a dev-lane pre-release — OK for stable publish."

      - name: Log inputs
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Crates: ${{ inputs.crates }}"

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # ── Per-crate idempotency check ──────────────────────────
          is_published() {
            local crate="$1" version="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "User-Agent: greentic-crates-publish" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            [[ "$status" == "200" ]]
          }

          # ── Propagation polling ──────────────────────────────────
          wait_for_propagation() {
            local crate="$1" version="$2"
            local timeout=300  # 5 minutes
            local interval=30
            local elapsed=0

            while [[ "$elapsed" -lt "$timeout" ]]; do
              if is_published "$crate" "$version"; then
                echo "  ✓ ${crate} ${version} available on crates.io (${elapsed}s)"
                return 0
              fi
              echo "  ⏳ Waiting for ${crate} ${version} to propagate (${elapsed}s/${timeout}s)..."
              sleep "$interval"
              elapsed=$((elapsed + interval))
            done

            echo "::warning::${crate} ${version} not visible after ${timeout}s — continuing"
            return 0  # non-fatal: index may still catch up
          }

          # ── Publish with exponential backoff ─────────────────────
          publish_crate() {
            local crate="$1"
            local version="$2"
            local max_retries=3
            local delay=10

            # Skip if already published (idempotent retry)
            if is_published "$crate" "$version"; then
              echo "✓ ${crate} ${version} already on crates.io — skipping"
              return 0
            fi

            local attempt=0
            local output=""

            while [[ "$attempt" -lt "$max_retries" ]]; do
              attempt=$((attempt + 1))
              echo "::group::Publishing ${crate} (attempt ${attempt}/${max_retries})"

              if output=$(cargo publish -p "${crate}" --allow-dirty 2>&1); then
                echo "$output"
                echo "::endgroup::"
                echo "✓ Published ${crate} ${version}"
                return 0
              fi

              echo "$output"
              echo "::endgroup::"

              # "already exists" → treat as success
              if echo "$output" | grep -qiE "already exists|already uploaded|crate version .* is already uploaded"; then
                echo "✓ ${crate} already published — skipping (idempotent)"
                return 0
              fi

              # Rate-limited or transient server error → retry with backoff
              if echo "$output" | grep -qiE "429|503|502|500|rate.limit|timed.out|connection.*reset|broken.pipe"; then
                echo "⚠ Transient error, retrying in ${delay}s..."
                sleep "$delay"
                delay=$((delay * 2))
                [[ "$delay" -gt 120 ]] && delay=120
                continue
              fi

              # Other error → fail immediately (bad metadata, auth failure, etc.)
              echo "::error::Failed to publish ${crate}: non-retryable error"
              return 1
            done

            echo "::error::Failed to publish ${crate} after ${max_retries} attempts"
            return 1
          }

          # ── Main publish loop ────────────────────────────────────

          echo "Publishing crates: ${{ inputs.crates }}"
          echo "Version: ${VERSION}"
          echo ""

          published=0
          for crate in ${{ inputs.crates }}; do
            # Resolve this crate's actual version (may differ from root VERSION
            # in mixed-version workspaces, e.g. greentic-deploy-spec 0.2.x).
            crate_version=$(cargo metadata --format-version=1 --no-deps \
              | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            if [[ -z "$crate_version" ]]; then
              echo "::error::Could not resolve version for crate '${crate}' — not found in cargo metadata"
              exit 1
            fi

            publish_crate "${crate}" "${crate_version}"
            wait_for_propagation "${crate}" "${crate_version}"
            published=$((published + 1))
          done

          echo ""
          echo "✓ All ${published} crate(s) published to crates.io"
