name: PR CI (baseline)

# Unified PR-time baseline: fmt + clippy + test + build (variant-dispatched:
# host | wasm). This is the reusable that per-repo ci.yml should call on
# `pull_request`. Heavy gates — semver-checks, coverage, perf, Codex
# remediation — live in separate scheduled reusables
# (nightly-semver-advisory.yml, nightly-coverage.yml, nightly-perf.yml,
# nightly-audit.yml). See plans/binary-bifurcation.md Phase A.
#
# Dependency review is NOT part of this reusable. It lives in
# `dependency-review.yml` and callers invoke it separately. Including it here
# would force every caller into the `pull-requests: write` permission cap at
# graph-build time, even when gated off via `run-dependency-review: false` —
# GitHub validates nested-reusable permissions before `if:` evaluation. See
# the regression post-mortem that motivated this split (PR #94 fallout).
#
# ── Actions-cache scoping and budget (read before touching rust-cache) ──
#
# GitHub scopes Actions caches by ref. A run may restore an entry created on
# its OWN ref, on its PR BASE branch, or on the repository DEFAULT branch —
# nothing else. Two consequences shape the config below.
#
# 1. A caller whose ci.yml triggers on `pull_request` only never seeds a
#    restorable entry: `main` saves nothing, and each PR's save lands on
#    `refs/pull/N/merge`, a scope no other PR reads. Measured on
#    greentic-start 2026-07-30, 30/30 recent ci.yml runs were `pull_request`
#    and the restore step said "No cache found." on a first run every time —
#    ~370s of the 401s `cargo test` step was dependency compilation. Callers
#    therefore want `push: branches: [main]` in their own ci.yml;
#    greentic-deployer, greentic-start and greentic-setup have it.
#
# 2. The cache limit is 10 GB PER REPOSITORY, and it binds. On 2026-07-30
#    greentic-start held 10.38 GB across 8 entries and greentic-setup
#    10.59 GB across 11 — both over, so entries were being evicted within
#    ~30 minutes of being written. A single test-job entry is ~1.6 GB and a
#    clippy entry ~0.77 GB, so every concurrent PR was burning ~2.4 GB of a
#    10 GB budget on entries only that PR could ever read, evicting the
#    default-branch entry every other run needs. Hence `save-if` below
#    (PRs restore, pushes save) and the debug-info trim in `env` (smaller
#    entries survive longer and upload/download faster).
#
# Do NOT give clippy and test a shared `shared-key`. rust-cache's default key
# includes the job name, which is what keeps them separate. Sharing one key
# would make both jobs race to reserve the same entry; the loser logs
# "Failed to save" and the survivor is whichever finished first — usually
# clippy, whose target dir has no codegen artifacts. Every later test job
# would then restore a clippy-shaped cache and re-codegen the whole
# dependency graph. Two keys cost ~0.8 GB more budget and are worth it.

on:
  workflow_call:
    inputs:
      variant:
        description: "Build variant: host (native) or wasm (wasm32-wasip2)"
        type: string
        default: "host"
      rust-version:
        description: "Rust toolchain version"
        type: string
        default: "1.95.0"
      clippy-args:
        description: "Arguments passed to cargo clippy"
        type: string
        default: ""
      test-args:
        description: "Arguments passed to cargo test"
        type: string
        default: ""
      setup-script:
        description: "Optional shell commands to run before checks"
        type: string
        default: ""
      checkout-submodules:
        description: "Checkout git submodules (false, true, or recursive)"
        type: string
        default: "false"
      toolchain-variant:
        description: "Canonical toolchain variant for drift check (host or wasm)"
        type: string
        default: ""
      runner:
        description: "Linux runner label (e.g. blacksmith-4vcpu-ubuntu-2404-arm for Blacksmith ARM)"
        type: string
        default: "ubuntu-latest"
      cache-save-on-pr:
        description: "Let pull_request runs SAVE a rust-cache entry, not just restore one. Default false — see the cache-scoping note in the header. Set true only to restore the old behaviour for a repo that regresses."
        type: boolean
        default: false
      min-free-disk-gb:
        description: "Only reclaim preinstalled tooling when / has less than this many GB free. Current GitHub-hosted images start with ~88 GB free, so the default of 40 skips a 70-90s no-op. Raise (e.g. 9999) to always reclaim; 0 to never."
        type: number
        default: 40
      # ── wasm-only inputs ────────────────────────────────────────────
      use-cargo-component:
        description: "Use 'cargo component build' instead of 'cargo build' (wasm only)"
        type: boolean
        default: false
      cargo-component-version:
        description: "cargo-component version to install (wasm only)"
        type: string
        default: "0.21.1"
      wasm-check-args:
        description: "Arguments passed to cargo check for WASM target"
        type: string
        default: "--target wasm32-wasip2"
      wasm-build-args:
        description: "Arguments passed to cargo build for WASM target"
        type: string
        default: "--target wasm32-wasip2 --release"
      validate-component:
        description: "Validate WASM output is a valid WIT component via wasm-tools"
        type: boolean
        default: true
      wasm-validate-glob:
        description: "Glob pattern for .wasm files to validate"
        type: string
        default: "target/wasm32-wasip2/release/*.wasm"
      # ── dependency-review inputs (DEPRECATED no-ops) ────────────────
      # Dependency review moved out of this reusable to avoid the graph-time
      # permission cap issue (see header). These inputs are retained as
      # no-ops so the ~13 existing callers (host/wasm thin wrappers + direct
      # callers) don't need a synchronized update. Invoke
      # `dependency-review.yml` directly for the dep-review job.
      run-dependency-review:
        description: "DEPRECATED no-op. dep-review moved to dependency-review.yml."
        type: boolean
        default: false
      dep-review-fail-on-severity:
        description: "DEPRECATED no-op. See run-dependency-review."
        type: string
        default: "moderate"
      dep-review-warn-only:
        description: "DEPRECATED no-op. See run-dependency-review."
        type: boolean
        default: false
      dep-review-allow-licenses:
        description: "DEPRECATED no-op. See run-dependency-review."
        type: string
        default: ""
      dep-review-deny-licenses:
        description: "DEPRECATED no-op. See run-dependency-review."
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info dominates target-dir size, and target-dir size is what makes the
  # cache entries big (see the budget note in the header) and slow to upload.
  # `line-tables-only` keeps the file/line tables, so panic backtraces in CI
  # still resolve to real source locations; it drops only the variable/type
  # DWARF that a debugger would want and CI never reads. Measured locally on
  # greentic-start (`cargo test --no-run -p greentic-start --all-features`,
  # cold target dir, CARGO_INCREMENTAL=0): 8.16 GiB -> 6.02 GiB (-26%) and
  # 3m42s -> 3m08s (-15%). greentic-mcp already pins the same value in its own
  # `[profile.test]`, so this generalises what that repo proved out.
  #
  # These are env-level so they override a caller's `[profile]` without
  # touching RUSTFLAGS (setting RUSTFLAGS here would silently discard any
  # `[build] rustflags` a caller has in .cargo/config.toml). `--release`
  # builds are unaffected: profile `release` already defaults to debug = 0.
  #
  # NOTE: rust-cache hashes CARGO_*/RUST* env vars into its key, so landing
  # this invalidates every existing entry once. One cold run per job, then
  # steady state.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Phase 4a guard: PRs targeting main MUST NOT carry pre-release version
  # suffixes in any Cargo.toml. Pre-release versions (-dev.N, -alpha.N,
  # -beta.N, -rc.N) only belong on develop, where CodeArtifact publishes
  # them for opted-in consumers. Main feeds crates.io and must stay stable.
  # Without this guard, a developer could land 0.6.0-dev.0 on main via an
  # accidental forward-port, shipping a broken patch lane to every consumer.
  main-pre-release-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - name: Reject pre-release versions on main
        shell: bash
        run: |
          set -euo pipefail
          # Match "version = "X.Y.Z-dev.N"" (and -alpha/-beta/-rc variants)
          # in any non-target Cargo.toml, anchored to the `version = "..."`
          # package/workspace line. Dep-req strings like ">=0.6.0-dev, <..."
          # are deliberately skipped — they start with a comparator, not a
          # bare string, so the pattern won't catch them.
          offenders=$(
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | xargs -0 grep -HnE '^version = "[0-9]+\.[0-9]+\.[0-9]+-(dev|alpha|beta|rc)\.' \
              || true
          )
          if [ -n "$offenders" ]; then
            echo "::error title=Pre-release on main::Cargo.toml files carry a pre-release version. Main must not hold -dev/-alpha/-beta/-rc suffixes (those belong on develop)."
            echo "$offenders"
            echo ""
            echo "To fix: either strip the suffix (if this is a minor cut, let weekly-stable-prepare handle it via the develop → main release PR), or target the PR at develop instead of main."
            exit 1
          fi
          echo "✓ No pre-release version suffixes in Cargo.toml files"

  toolchain-check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - name: Check toolchain drift
        shell: bash
        run: |
          set -euo pipefail
          VARIANT="${{ inputs.toolchain-variant != '' && inputs.toolchain-variant || inputs.variant }}"
          BASE="https://raw.githubusercontent.com/greenticai/.github/main/toolchain"

          curl -sL "${BASE}/${VARIANT}/rust-toolchain.toml" -o /tmp/canonical-toolchain.toml
          curl -sL "${BASE}/rustfmt.toml" -o /tmp/canonical-rustfmt.toml

          DRIFT=0
          if ! diff -q rust-toolchain.toml /tmp/canonical-toolchain.toml >/dev/null 2>&1; then
            echo "::warning::rust-toolchain.toml differs from canonical ${VARIANT} variant"
            diff rust-toolchain.toml /tmp/canonical-toolchain.toml || true
            DRIFT=1
          fi
          if ! diff -q rustfmt.toml /tmp/canonical-rustfmt.toml >/dev/null 2>&1; then
            echo "::warning::rustfmt.toml differs from canonical"
            diff rustfmt.toml /tmp/canonical-rustfmt.toml || true
            DRIFT=1
          fi
          # DRIFT is accumulated during the Phase-A rollout grace period,
          # ready to be wired to `exit $DRIFT` once hard-fail flips on. The
          # null-read below keeps shellcheck SC2034 quiet without needing a
          # directive scoped to a specific assignment (shellcheck reports
          # SC2034 at the LAST assignment, which makes directive placement
          # fragile here). See plans/binary-bifurcation.md.
          : "${DRIFT}"

  fmt:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: rustfmt
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - name: Free disk space
        shell: bash
        env:
          MIN_FREE_GB: ${{ inputs.min-free-disk-gb }}
        run: |
          set -euo pipefail
          # Reclaim preinstalled tooling the Rust build never uses (dotnet,
          # Haskell, CodeQL, Android, boost). This exists because a --workspace
          # --all-features clippy/test build of a large workspace (e.g.
          # greentic-deployer) once exhausted the GitHub-hosted runner disk
          # mid-run; the runner is killed before it can upload logs, which
          # surfaces as an unexplained, intermittent job failure.
          #
          # It is now gated on MEASURED free space, because the `sudo rm -rf`
          # costs 21-87s in every clippy and test job and the premise no longer
          # holds. Eleven samples on 2026-07-30, median ~50s: greentic-start
          # test 70/66/24/22s and clippy 87/66/29s, greentic-setup test 67/27s
          # and clippy 74/32s, greentic-deployer test 21s. It is highly variable
          # because it is bound by runner I/O, not by the amount deleted. All
          # three repos report the same image on `ubuntu-latest`:
          #
          #     /dev/root  145G  58G  88G  40% /     (before)
          #     /dev/root  145G  40G  105G 28% /     (after, 18 GB reclaimed)
          #
          # 88 GB free is far more than any target dir in this org: a cold
          # `cargo test --no-run -p greentic-start --all-features` target dir
          # measures ~8 GiB, and less with the debug-info trim in `env`. So the
          # cleanup was buying 18 GB of headroom nobody needed, twice per run,
          # in ~30 caller repos.
          #
          # The guard is self-healing rather than a deletion: if GitHub ever
          # ships a smaller image, or a workspace really does grow into the
          # headroom, `avail < MIN_FREE_GB` trips and the cleanup comes back on
          # its own. Raise min-free-disk-gb to force it (9999 = always, the old
          # behaviour); 0 disables it. The "Disk usage after build" step below
          # reports the real high-water mark so the threshold stays evidence-based.
          df -h /
          # POSIX `df -Pk` rather than `df --output=avail`: portable to any
          # runner label a caller passes via `runner:`.
          avail=$(df -Pk / | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          if [ "${avail}" -ge "${MIN_FREE_GB}" ]; then
            echo "${avail} GB free on / >= ${MIN_FREE_GB} GB threshold — skipping cleanup."
            exit 0
          fi
          echo "${avail} GB free on / < ${MIN_FREE_GB} GB threshold — reclaiming preinstalled tooling."
          # Best-effort: no-ops on runners lacking these paths or passwordless sudo.
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          components: clippy
          targets: ${{ inputs.variant == 'wasm' && 'wasm32-wasip2' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs RESTORE but do not SAVE. See the cache-budget note in the
          # header: a PR's own entry is scoped to `refs/pull/N/merge`, so only
          # that PR can ever read it, yet it competes for the same 10 GB
          # repository budget as the default-branch entry every run restores
          # from. greentic-start sat at 10.38 GB against the 10 GB limit, with ~2.4 GB
          # of it held by a single open PR. The cost is that a re-push to a PR no
          # longer restores that PR's own previous entry — but once the default
          # branch is warm the dependency set is the same, and rust-cache falls
          # back through its restore-keys prefix when Cargo.lock differs.
          save-if: ${{ inputs.cache-save-on-pr || github.event_name != 'pull_request' }}
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
      - name: Resolve clippy args
        id: clippy_args
        shell: bash
        run: |
          set -euo pipefail
          CLIPPY_ARGS="${{ inputs.clippy-args }}"
          if [ -z "${CLIPPY_ARGS}" ]; then
            if [ "${{ inputs.variant }}" = "wasm" ]; then
              CLIPPY_ARGS='--workspace --all-targets -- -D warnings'
            else
              CLIPPY_ARGS='--workspace --all-targets --all-features -- -D warnings'
            fi
          fi
          echo "args=${CLIPPY_ARGS}" >> "$GITHUB_OUTPUT"
      - run: cargo clippy ${{ steps.clippy_args.outputs.args }}
      - name: Disk usage after build
        if: always()
        shell: bash
        run: df -h /

  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - name: Free disk space
        shell: bash
        env:
          MIN_FREE_GB: ${{ inputs.min-free-disk-gb }}
        run: |
          set -euo pipefail
          # Reclaim preinstalled tooling the Rust build never uses (dotnet,
          # Haskell, CodeQL, Android, boost). This exists because a --workspace
          # --all-features clippy/test build of a large workspace (e.g.
          # greentic-deployer) once exhausted the GitHub-hosted runner disk
          # mid-run; the runner is killed before it can upload logs, which
          # surfaces as an unexplained, intermittent job failure.
          #
          # It is now gated on MEASURED free space, because the `sudo rm -rf`
          # costs 21-87s in every clippy and test job and the premise no longer
          # holds. Eleven samples on 2026-07-30, median ~50s: greentic-start
          # test 70/66/24/22s and clippy 87/66/29s, greentic-setup test 67/27s
          # and clippy 74/32s, greentic-deployer test 21s. It is highly variable
          # because it is bound by runner I/O, not by the amount deleted. All
          # three repos report the same image on `ubuntu-latest`:
          #
          #     /dev/root  145G  58G  88G  40% /     (before)
          #     /dev/root  145G  40G  105G 28% /     (after, 18 GB reclaimed)
          #
          # 88 GB free is far more than any target dir in this org: a cold
          # `cargo test --no-run -p greentic-start --all-features` target dir
          # measures ~8 GiB, and less with the debug-info trim in `env`. So the
          # cleanup was buying 18 GB of headroom nobody needed, twice per run,
          # in ~30 caller repos.
          #
          # The guard is self-healing rather than a deletion: if GitHub ever
          # ships a smaller image, or a workspace really does grow into the
          # headroom, `avail < MIN_FREE_GB` trips and the cleanup comes back on
          # its own. Raise min-free-disk-gb to force it (9999 = always, the old
          # behaviour); 0 disables it. The "Disk usage after build" step below
          # reports the real high-water mark so the threshold stays evidence-based.
          df -h /
          # POSIX `df -Pk` rather than `df --output=avail`: portable to any
          # runner label a caller passes via `runner:`.
          avail=$(df -Pk / | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          if [ "${avail}" -ge "${MIN_FREE_GB}" ]; then
            echo "${avail} GB free on / >= ${MIN_FREE_GB} GB threshold — skipping cleanup."
            exit 0
          fi
          echo "${avail} GB free on / < ${MIN_FREE_GB} GB threshold — reclaiming preinstalled tooling."
          # Best-effort: no-ops on runners lacking these paths or passwordless sudo.
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost 2>/dev/null || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs RESTORE but do not SAVE. See the cache-budget note in the
          # header: a PR's own entry is scoped to `refs/pull/N/merge`, so only
          # that PR can ever read it, yet it competes for the same 10 GB
          # repository budget as the default-branch entry every run restores
          # from. greentic-start sat at 10.38 GB against the 10 GB limit, with ~2.4 GB
          # of it held by a single open PR. The cost is that a re-push to a PR no
          # longer restores that PR's own previous entry — but once the default
          # branch is warm the dependency set is the same, and rust-cache falls
          # back through its restore-keys prefix when Cargo.lock differs.
          save-if: ${{ inputs.cache-save-on-pr || github.event_name != 'pull_request' }}
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
      - name: Resolve test args
        id: test_args
        shell: bash
        run: |
          set -euo pipefail
          TEST_ARGS="${{ inputs.test-args }}"
          if [ -z "${TEST_ARGS}" ]; then
            if [ "${{ inputs.variant }}" = "wasm" ]; then
              TEST_ARGS='--workspace --all-targets'
            else
              TEST_ARGS='--workspace --all-features'
            fi
          fi
          echo "args=${TEST_ARGS}" >> "$GITHUB_OUTPUT"
      - run: cargo test ${{ steps.test_args.outputs.args }}
      - name: Disk usage after build
        if: always()
        shell: bash
        run: df -h /

  wasm:
    if: inputs.variant == 'wasm'
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: ${{ inputs.checkout-submodules }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs RESTORE but do not SAVE. See the cache-budget note in the
          # header: a PR's own entry is scoped to `refs/pull/N/merge`, so only
          # that PR can ever read it, yet it competes for the same 10 GB
          # repository budget as the default-branch entry every run restores
          # from. greentic-start sat at 10.38 GB against the 10 GB limit, with ~2.4 GB
          # of it held by a single open PR. The cost is that a re-push to a PR no
          # longer restores that PR's own previous entry — but once the default
          # branch is warm the dependency set is the same, and rust-cache falls
          # back through its restore-keys prefix when Cargo.lock differs.
          save-if: ${{ inputs.cache-save-on-pr || github.event_name != 'pull_request' }}
      - if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}
      - name: Install cargo-binstall
        if: ${{ inputs.use-cargo-component || inputs.validate-component }}
        uses: taiki-e/install-action@cargo-binstall
      - name: Ensure cargo bin path is on PATH
        if: ${{ inputs.use-cargo-component || inputs.validate-component }}
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-component
        if: ${{ inputs.use-cargo-component }}
        run: cargo binstall -y cargo-component@${{ inputs.cargo-component-version }} --force
      - name: Check (wasm32-wasip2)
        run: |
          if [ "${{ inputs.use-cargo-component }}" = "true" ]; then
            cargo component check ${{ inputs.wasm-check-args }}
          else
            cargo check ${{ inputs.wasm-check-args }}
          fi
      - name: Build (wasm32-wasip2, release)
        run: |
          if [ "${{ inputs.use-cargo-component }}" = "true" ]; then
            cargo component build ${{ inputs.wasm-build-args }}
          else
            cargo build ${{ inputs.wasm-build-args }}
          fi
      - name: Install wasm-tools
        if: ${{ inputs.validate-component }}
        run: cargo binstall -y wasm-tools --force
      - name: Validate component
        if: ${{ inputs.validate-component }}
        shell: bash
        run: |
          set -euo pipefail
          command -v wasm-tools >/dev/null 2>&1 || {
            echo "::error::wasm-tools missing from PATH=$PATH"
            exit 127
          }
          count=0
          for wasm in ${{ inputs.wasm-validate-glob }}; do
            [ -f "$wasm" ] || continue
            echo "Validating: $wasm"
            wasm-tools validate "$wasm"
            if wasm-tools component wit "$wasm" > /dev/null 2>&1; then
              echo "  ✓ valid WIT component"
            else
              echo "  ✓ valid core module (not a component)"
            fi
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No .wasm files found matching ${{ inputs.wasm-validate-glob }}"
            exit 1
          fi
          echo "Validated $count module(s)"
