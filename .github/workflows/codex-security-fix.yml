# NOTE: file name and workflow `name:` are intentionally kept as "Codex Security
# Fix" through Phase G of plans/migrate-codex-deepseek.md so that (a) the 67
# caller `uses:` references stay valid and (b) the Slack mute at
# notify-failure.yml:59 (`startsWith(workflow-name, 'Codex ')`) keeps firing
# during the silent pilot. Both will be renamed once the migration is verified.
name: Codex Security Fix

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to scan and patch (only for manual dispatch)"
        type: string
        default: ""
      max_alerts:
        description: "Maximum open alerts per source to include"
        type: string
        default: "20"
      include_all_alerts:
        description: "Fetch all repository-wide alerts even on PR trigger"
        type: boolean
        default: false
      deepseek-model:
        description: "OpenRouter model ID for remediation. Default: DeepSeek V4 Flash."
        type: string
        default: "deepseek/deepseek-v4-flash"
    secrets:
      OPENROUTER_API_KEY:
        description: "OpenRouter API key for DeepSeek remediation"
        required: false
      GREENTIC_CI_APP_ID:
        description: "GitHub App ID for greentic-ci App token minting"
        required: false
      GREENTIC_CI_APP_PRIVATE_KEY:
        description: "GitHub App private key for greentic-ci App token minting"
        required: false

permissions:
  contents: read

jobs:
  # ── Job 1: Detect whether there is remediation work to do ───────────
  # Runs unconditionally so we know whether to skip the LLM job.
  # No `if: false` guard — re-enables the pipeline (replacing the disabled
  # Codex flow). Token cost is gated by job 2 not starting.
  detect-work:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    outputs:
      should-fix: ${{ steps.gate.outputs.should-fix }}
      alert-count: ${{ steps.alerts.outputs.count }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        # continue-on-error: App secrets are empty in greentic-biz private repos
        # (Free-plan org secrets don't propagate to private repos). Steps below
        # fall back to github.token, which has the per-job permissions block's
        # scopes (contents/pull-requests/security-events).
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GREENTIC_CI_APP_ID }}
          private-key: ${{ secrets.GREENTIC_CI_APP_PRIVATE_KEY }}

      - name: Loop guard – skip if triggered by any remediation commit
        id: loop_guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          COMMIT_MSG=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" \
            --jq '.commit.message' 2>/dev/null || echo "")
          # Transitional regex matches both codex (legacy) and deepseek (new)
          # remediation commits. Narrow to deepseek only after Phase G cleanup.
          if echo "$COMMIT_MSG" | grep -qE "^chore\((security|semver|deps)\): (codex|deepseek) remediation"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit is a remediation commit – skipping to prevent loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.loop_guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Fetch open security alerts
        if: steps.loop_guard.outputs.skip != 'true'
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          MAX_ALERTS: ${{ inputs.max_alerts }}
          INCLUDE_ALL: ${{ inputs.include_all_alerts }}
          IS_PR: ${{ github.event.pull_request && 'true' || 'false' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "${IS_PR}" == "true" ] && [ "${INCLUDE_ALL}" != "true" ]; then
            # Skip Dependabot alerts on PRs (dependency-review workflow handles those)
            echo "[]" > all-dependabot-alerts.json
            echo "[]" > dependabot-alerts.json

            # Fetch Code Scanning alerts (produced by CodeQL runs on main)
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${OWNER}/${REPO}/code-scanning/alerts?state=open&per_page=100" \
              > all-code-scanning-alerts.json || echo "[]" > all-code-scanning-alerts.json

            # Get files changed in this PR
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename' > pr-changed-files.txt || echo "" > pr-changed-files.txt

            # Filter code scanning alerts to only those in PR-changed files
            jq --rawfile changed_files pr-changed-files.txt '
              ($changed_files | split("\n") | map(select(. != ""))) as $files |
              [ .[] | select(.most_recent_instance.location.path as $p | $files | any(. == $p)) ]
            ' all-code-scanning-alerts.json > pr-code-scanning-filtered.json \
              || echo "[]" > pr-code-scanning-filtered.json

            # Apply max_alerts limit
            jq ".[0:(${MAX_ALERTS}|tonumber)]" pr-code-scanning-filtered.json > code-scanning-alerts.json

            CODE_COUNT=$(jq 'length' code-scanning-alerts.json)

            jq -n \
              --slurpfile dependabot dependabot-alerts.json \
              --slurpfile code_scanning code-scanning-alerts.json \
              '{dependabot: $dependabot[0], code_scanning: $code_scanning[0]}' > security-alerts.json

            echo "count=${CODE_COUNT}" >> "$GITHUB_OUTPUT"
            echo "Found ${CODE_COUNT} Code Scanning alerts in PR-changed files (filtered from $(jq 'length' all-code-scanning-alerts.json) total)"
            exit 0
          fi

          # Fetch Dependabot alerts
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/dependabot/alerts?state=open&per_page=100" > all-dependabot-alerts.json || echo "[]" > all-dependabot-alerts.json
          jq ".[0:(${MAX_ALERTS}|tonumber)]" all-dependabot-alerts.json > dependabot-alerts.json

          # Fetch Code Scanning alerts
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/code-scanning/alerts?state=open&per_page=100" > all-code-scanning-alerts.json || echo "[]" > all-code-scanning-alerts.json
          jq ".[0:(${MAX_ALERTS}|tonumber)]" all-code-scanning-alerts.json > code-scanning-alerts.json

          DEP_COUNT=$(jq 'length' dependabot-alerts.json)
          CODE_COUNT=$(jq 'length' code-scanning-alerts.json)
          TOTAL_COUNT=$((DEP_COUNT + CODE_COUNT))

          jq -n \
            --slurpfile dependabot dependabot-alerts.json \
            --slurpfile code_scanning code-scanning-alerts.json \
            '{dependabot: $dependabot[0], code_scanning: $code_scanning[0]}' > security-alerts.json

          echo "count=${TOTAL_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Found ${DEP_COUNT} open Dependabot alerts and ${CODE_COUNT} open Code Scanning alerts"

      - name: Build remediation prompt
        if: steps.loop_guard.outputs.skip != 'true' && (steps.alerts.outputs.count != '0' || github.event.pull_request)
        env:
          IS_PR: ${{ github.event.pull_request && 'true' || 'false' }}
        run: |
          set -euo pipefail
          cat > codex-prompt.txt <<'PROMPT'
          You are operating in a CI environment as a Security Reviewer.

          Task:
          1) Analyze the security alerts listed below.
          2) Apply minimal, safe fixes to remediate vulnerabilities.
          3) Write SECURITY_FIX_REPORT.md summarizing your actions.

          Security alerts JSON:
          PROMPT

          cat security-alerts.json >> codex-prompt.txt

          # Add compact CodeQL section for PRs with filtered alerts
          if [ "${IS_PR}" == "true" ] && [ -f code-scanning-alerts.json ] && [ "$(jq 'length' code-scanning-alerts.json 2>/dev/null)" -gt 0 ]; then
            cat >> codex-prompt.txt <<'CODEQL_SECTION'

          CodeQL Code Scanning Alerts (filtered to files changed in this PR):
          The following alerts were found by CodeQL static analysis in files touched by this PR.
          Each alert includes the file path, line range, rule ID, and description.
          Please review and fix these issues in the relevant files.
          CODEQL_SECTION
            jq '[.[] | {
              rule: .rule.id,
              severity: .rule.security_severity_level,
              description: .rule.description,
              file: .most_recent_instance.location.path,
              start_line: .most_recent_instance.location.start_line,
              end_line: .most_recent_instance.location.end_line,
              message: .most_recent_instance.message.text
            }]' code-scanning-alerts.json >> codex-prompt.txt
          fi

      - name: Compute should-fix gate
        id: gate
        run: |
          set -euo pipefail
          # Loop-guard short-circuit (also catches the case where checkout was skipped).
          if [ "${{ steps.loop_guard.outputs.skip }}" = "true" ]; then
            echo "should-fix=false" >> "$GITHUB_OUTPUT"
            echo "Skipped due to loop guard."
            exit 0
          fi
          # On non-PR triggers (nightly schedule, workflow_dispatch) only engage
          # the LLM when there's at least one alert. On PRs we engage unconditionally
          # — the PR diff itself is the unit of work (preserves prior Codex behavior).
          if [ "${{ steps.alerts.outputs.count }}" = "0" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should-fix=false" >> "$GITHUB_OUTPUT"
            echo "No alerts; downstream LLM job will be skipped."
            exit 0
          fi
          echo "should-fix=true" >> "$GITHUB_OUTPUT"

      - name: Upload detection artifacts
        if: steps.gate.outputs.should-fix == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-security-detect
          path: |
            all-dependabot-alerts.json
            all-code-scanning-alerts.json
            dependabot-alerts.json
            code-scanning-alerts.json
            pr-code-scanning-filtered.json
            pr-changed-files.txt
            security-alerts.json
            codex-prompt.txt
          if-no-files-found: warn

  # ── Job 2: DeepSeek (via Goose + OpenRouter) remediation ────────────
  # Job-level `if:` ensures the runner only spins up when there is actual
  # work — this is where OpenRouter tokens would otherwise burn.
  deepseek-fix:
    needs: detect-work
    if: needs.detect-work.outputs.should-fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: read
    steps:
      - name: Mint GitHub App token
        id: app-token
        # See detect-work job for the Free-plan rationale.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GREENTIC_CI_APP_ID }}
          private-key: ${{ secrets.GREENTIC_CI_APP_PRIVATE_KEY }}

      - name: Check OpenRouter availability
        id: openrouter_available
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured; skipping DeepSeek remediation."
          fi

      - name: Checkout code
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Download detection artifacts
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: deepseek-security-detect

      - name: Install Goose
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: clouatre-labs/setup-goose-action@7a86bfba08001947997ed330a60215d871f40f8b  # v1.0.8
        with:
          version: '1.34.0'

      - name: Run DeepSeek remediation via OpenRouter
        if: steps.openrouter_available.outputs.enabled == 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOSE_PROVIDER: openrouter
          GOOSE_MODEL: ${{ inputs.deepseek-model }}
          GOOSE_DISABLE_KEYRING: '1'
        run: |
          goose run --no-session --instructions codex-prompt.txt

      - name: Commit and push fixes
        if: steps.openrouter_available.outputs.enabled == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ ! -f SECURITY_FIX_REPORT.md ]; then
            echo "No changes created by DeepSeek"
            exit 0
          fi

          git config user.name "greentic-ci[bot]"
          git config user.email "3383573+greentic-ci[bot]@users.noreply.github.com"

          git add -u
          if ! git commit -m "chore(security): deepseek remediation for security alerts"; then
            echo "No changes to commit"
            exit 0
          fi

          if [ -n "${BRANCH}" ]; then
            # PR-triggered: push patches back to the PR's head branch so its CI re-runs.
            git push origin "HEAD:${BRANCH}"
          else
            # Scheduled/dispatch with no branch input: open a new remediation PR
            # against the default branch instead of force-pushing to it.
            NEW_BRANCH="chore/deepseek-security-${GITHUB_RUN_ID}"
            git push origin "HEAD:${NEW_BRANCH}"
            PR_BODY=$(printf '%s\n\n%s\n' \
              'Automated remediation from scheduled DeepSeek security scan.' \
              "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")
            gh pr create \
              --title "chore(security): deepseek remediation for security alerts" \
              --body "${PR_BODY}" \
              --head "${NEW_BRANCH}" \
              --base "${GITHUB_REF_NAME}"
          fi

      - name: Post DeepSeek Review
        if: steps.openrouter_available.outputs.enabled == 'true' && github.event.pull_request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -f SECURITY_FIX_REPORT.md ]; then
            echo "Posting security fix report to ${PR_URL}"
            gh pr review "${PR_URL}" --comment --body-file SECURITY_FIX_REPORT.md
          fi

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-security-run
          path: |
            all-dependabot-alerts.json
            all-code-scanning-alerts.json
            dependabot-alerts.json
            code-scanning-alerts.json
            pr-code-scanning-filtered.json
            pr-changed-files.txt
            security-alerts.json
            codex-prompt.txt
            SECURITY_FIX_REPORT.md
          if-no-files-found: ignore
