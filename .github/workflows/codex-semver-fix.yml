# NOTE: file name and workflow `name:` are intentionally kept as "Codex Semver
# Fix" through Phase G of plans/migrate-codex-deepseek.md so that (a) the 67
# caller `uses:` references stay valid and (b) the Slack mute at
# notify-failure.yml:59 (`startsWith(workflow-name, 'Codex ')`) keeps firing
# during the silent pilot. Both will be renamed once the migration is verified.
name: Codex Semver Fix

on:
  workflow_call:
    inputs:
      branch:
        description: "Branch to scan and patch (only for manual dispatch)"
        type: string
        default: ""
      rust-version:
        description: "Rust toolchain version"
        type: string
        default: "1.95.0"
      semver-checks-package:
        description: "Comma-separated list of packages to check (empty = all)"
        type: string
        default: ""
      setup-script:
        description: "Optional shell commands to run before checks"
        type: string
        default: ""
      deepseek-model:
        description: "OpenRouter model ID for remediation. Default: DeepSeek V4 Pro (semver edits are structural)."
        type: string
        default: "openrouter/deepseek/deepseek-v4-pro"
    secrets:
      OPENROUTER_API_KEY:
        description: "OpenRouter API key for DeepSeek remediation"
        required: false
      GREENTIC_CI_APP_ID:
        description: "GitHub App ID for greentic-ci App token minting"
        required: false
      GREENTIC_CI_APP_PRIVATE_KEY:
        description: "GitHub App private key for greentic-ci App token minting"
        required: false

permissions:
  contents: read

jobs:
  # ── Job 1: Detect semver violations ─────────────────────────────────
  # Runs unconditionally so we know whether to skip the LLM job.
  # No `if: false` guard — re-enables the pipeline (replacing the disabled
  # Codex flow). Token cost is gated by job 2 not starting.
  detect-work:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-fix: ${{ steps.gate.outputs.should-fix }}
      semver-status: ${{ steps.semver.outputs.status }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GREENTIC_CI_APP_ID }}
          private-key: ${{ secrets.GREENTIC_CI_APP_PRIVATE_KEY }}

      - name: Loop guard – skip if triggered by any remediation commit
        id: loop_guard
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          COMMIT_MSG=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" \
            --jq '.commit.message' 2>/dev/null || echo "")
          # Transitional regex matches both codex (legacy) and deepseek (new)
          # remediation commits. Narrow to deepseek only after Phase G cleanup.
          if echo "$COMMIT_MSG" | grep -qE "^chore\((security|semver|deps)\): (codex|deepseek) remediation"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit is a remediation commit – skipping to prevent loop."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.loop_guard.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Rust
        if: steps.loop_guard.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust-version }}

      - uses: Swatinem/rust-cache@v2
        if: steps.loop_guard.outputs.skip != 'true'

      - name: Run setup script
        if: steps.loop_guard.outputs.skip != 'true' && inputs.setup-script != ''
        run: ${{ inputs.setup-script }}

      - name: Install cargo-semver-checks
        if: steps.loop_guard.outputs.skip != 'true'
        run: cargo install cargo-semver-checks --locked

      - name: Run semver-checks
        id: semver
        if: steps.loop_guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          PACKAGE_ARG=""
          if [ -n "${{ inputs.semver-checks-package }}" ]; then
            IFS=',' read -ra PKGS <<< "${{ inputs.semver-checks-package }}"
            for pkg in "${PKGS[@]}"; do
              PACKAGE_ARG="${PACKAGE_ARG} -p ${pkg}"
            done
          fi

          echo "Running: cargo semver-checks check-release ${PACKAGE_ARG}"
          if cargo semver-checks check-release ${PACKAGE_ARG} 2>&1 | tee semver-output.txt; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
            echo "No semver violations found."
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "Semver violations detected — will attempt DeepSeek remediation."
          fi

      - name: Build remediation prompt
        if: steps.loop_guard.outputs.skip != 'true' && steps.semver.outputs.status == 'fail'
        run: |
          set -euo pipefail
          cat > codex-prompt.txt <<'PROMPT'
          You are operating in a CI environment as a Rust Semver Reviewer.

          Task:
          1) Analyze the cargo-semver-checks violations listed below.
          2) Apply minimal, safe fixes to resolve each violation.
          3) Write SEMVER_FIX_REPORT.md summarizing your actions.

          Fix strategies (in order of preference):
          - For "enum variant added on exhaustive enum": add #[non_exhaustive] to the enum.
          - For "constructible struct adds field": add #[non_exhaustive] to the struct.
          - For "enum variant discriminant changed": add explicit discriminant values to preserve the original ordering, OR add #[non_exhaustive].
          - For removed/renamed public items: restore the old item as a deprecated alias if possible.
          - As a last resort: bump the crate version (minor for 0.x crates, major for 1.x+).

          Important rules:
          - Do NOT change any logic or behavior — only add attributes or version bumps.
          - Do NOT modify test files unless a test directly asserts on a removed item.
          - Prefer #[non_exhaustive] over version bumps — it is the least disruptive fix.
          - If adding #[non_exhaustive], also ensure existing match arms have a wildcard `_ => {}` catch-all where needed in the same crate.

          cargo-semver-checks output:
          PROMPT

          cat semver-output.txt >> codex-prompt.txt

      - name: Compute should-fix gate
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ steps.loop_guard.outputs.skip }}" = "true" ]; then
            echo "should-fix=false" >> "$GITHUB_OUTPUT"
            echo "Skipped due to loop guard."
            exit 0
          fi
          if [ "${{ steps.semver.outputs.status }}" != "fail" ]; then
            echo "should-fix=false" >> "$GITHUB_OUTPUT"
            echo "No semver violations; downstream LLM job will be skipped."
            exit 0
          fi
          echo "should-fix=true" >> "$GITHUB_OUTPUT"

      - name: Upload detection artifacts
        if: steps.gate.outputs.should-fix == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-semver-detect
          path: |
            semver-output.txt
            codex-prompt.txt
          if-no-files-found: warn

  # ── Job 2: DeepSeek (via Goose + OpenRouter) remediation ────────────
  # Job-level `if:` ensures the runner only spins up when there is actual
  # work — this is where OpenRouter tokens would otherwise burn.
  deepseek-fix:
    needs: detect-work
    if: needs.detect-work.outputs.should-fix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GREENTIC_CI_APP_ID }}
          private-key: ${{ secrets.GREENTIC_CI_APP_PRIVATE_KEY }}

      - name: Check OpenRouter availability
        id: openrouter_available
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENROUTER_API_KEY is not configured; skipping DeepSeek remediation."
          fi

      - name: Checkout code
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download detection artifacts
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: deepseek-semver-detect

      - name: Install Goose
        if: steps.openrouter_available.outputs.enabled == 'true'
        uses: clouatre-labs/setup-goose-action@7a86bfba08001947997ed330a60215d871f40f8b  # v1.0.8
        with:
          version: '1.34.0'

      - name: Run DeepSeek remediation via OpenRouter
        if: steps.openrouter_available.outputs.enabled == 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOSE_PROVIDER: openrouter
          GOOSE_MODEL: ${{ inputs.deepseek-model }}
          GOOSE_DISABLE_KEYRING: '1'
        run: |
          goose run --no-session --instructions codex-prompt.txt

      - name: Commit and push fixes
        if: steps.openrouter_available.outputs.enabled == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || inputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ ! -f SEMVER_FIX_REPORT.md ]; then
            echo "No changes created by DeepSeek"
            exit 0
          fi

          git config user.name "greentic-ci[bot]"
          git config user.email "3383573+greentic-ci[bot]@users.noreply.github.com"

          git add -u
          git commit -m "chore(semver): deepseek remediation for semver violations" || echo "No changes to commit"
          git push origin "HEAD:${BRANCH}"

      - name: Post DeepSeek Review
        if: steps.openrouter_available.outputs.enabled == 'true' && github.event.pull_request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -f SEMVER_FIX_REPORT.md ]; then
            echo "Posting semver fix report to ${PR_URL}"
            gh pr review "${PR_URL}" --comment --body-file SEMVER_FIX_REPORT.md
          fi

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-semver-run
          path: |
            semver-output.txt
            codex-prompt.txt
            SEMVER_FIX_REPORT.md
          if-no-files-found: ignore
